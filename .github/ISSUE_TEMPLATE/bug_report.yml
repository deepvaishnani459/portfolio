name: Bug / Content Issue
description: Report a broken link, typo, or display bug on the site
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What's wrong?
      description: Describe the issue and where on the site it appears.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page / section URL
      placeholder: "https://deepvaishnani459.github.io/portfolio/#resume"
  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: "Chrome 126 / iPhone 14"
